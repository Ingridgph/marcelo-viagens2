<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulário Administrativo | Marcelo Viagens</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/variables.css?v=18" />
  <link rel="stylesheet" href="../css/style.css?v=18" />

  <style>
    /* Estilos específicos do formulário administrativo */
    body { padding-top: 0; }
    .form-page {
      min-height: 100vh;
      background-color: var(--cream);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-xl) var(--space-md);
    }

    .form-card {
      background-color: var(--white);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: var(--space-xl);
      width: 100%;
      max-width: 560px;
    }

    .form-card__title {
      font-family: var(--font-heading);
      font-size: var(--text-xl);
      font-weight: 700;
      color: var(--navy);
      margin-bottom: var(--space-xs);
    }

    .form-card__subtitle {
      font-size: var(--text-sm);
      color: var(--muted);
      margin-bottom: var(--space-lg);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
      margin-bottom: var(--space-md);
    }

    .form-group label {
      font-size: var(--text-sm);
      font-weight: 600;
      color: var(--ink);
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      font-family: var(--font-body);
      font-size: var(--text-sm);
      color: var(--ink);
      background-color: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 0.75rem 1rem;
      width: 100%;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--amber);
      box-shadow: 0 0 0 3px rgba(230, 183, 95, 0.18);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 120px;
    }

    .form-actions {
      display: flex;
      gap: var(--space-sm);
      flex-wrap: wrap;
      margin-top: var(--space-lg);
    }

    .form-back {
      font-size: var(--text-sm);
      color: var(--muted);
      margin-top: var(--space-md);
      display: inline-block;
    }

    .form-back:hover {
      color: var(--navy);
    }
  </style>
</head>
<body>

  <main class="form-page">
    <div class="form-card">

      <h1 class="form-card__title">Formulário de contato</h1>
      <p class="form-card__subtitle">Preencha os dados abaixo e entraremos em contato em breve.</p>

      <form id="form-contato" novalidate>

        <div class="form-group">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" placeholder="Seu nome completo" autocomplete="name" required />
        </div>

        <div class="form-group">
          <label for="telefone">WhatsApp / Telefone</label>
          <input type="tel" id="telefone" name="telefone" placeholder="(63) 9 0000-0000" autocomplete="tel" required />
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email" />
        </div>

        <div class="form-group">
          <label for="tipo-servico">Tipo de serviço</label>
          <select id="tipo-servico" name="tipo-servico">
            <option value="" disabled selected>Selecione um serviço</option>
            <option value="fretamento">Fretamento</option>
            <option value="turismo">Turismo regional</option>
            <option value="grupo">Viagem em grupo</option>
            <option value="outro">Outro</option>
          </select>
        </div>

        <div class="form-group">
          <label for="destino">Destino desejado</label>
          <input type="text" id="destino" name="destino" placeholder="Ex: Jalapão, Chapada dos Veadeiros..." />
        </div>

        <div class="form-group">
          <label for="mensagem">Mensagem</label>
          <textarea id="mensagem" name="mensagem" placeholder="Descreva o que você precisa, número de pessoas, data estimada..."></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn--primary">Enviar mensagem</button>
          <button type="reset" class="btn btn--dark">Limpar</button>
        </div>

      </form>

      <a href="../index.html" class="form-back">← Voltar para o site</a>

    </div>
  </main>

  <script src="../js/script.js?v=18"></script>

</body>
</html>
